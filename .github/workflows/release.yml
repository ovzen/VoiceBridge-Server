name: Build and Release VoiceBridge Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --icon=icons/voicebridge.ico --name VoiceBridgeServer gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBridgeServer-Windows
          path: dist/VoiceBridgeServer.exe

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller python-appimage
      - name: Build AppImage
        run: |
          pyinstaller --onefile --name VoiceBridgeServer gui.py
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/VoiceBridgeServer AppDir/usr/bin/
          cp icons/voicebridge.png AppDir/usr/share/icons/hicolor/256x256/apps/voicebridge.png
          cp voicebridge-server.desktop AppDir/
          python -m python_appimage build app AppDir --python-version 3.14
          APPIMAGE=$(ls AppDir*.AppImage 2>/dev/null | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            APPIMAGE=$(find . -name "*.AppImage" -type f | head -n 1)
          fi
          if [ -n "$APPIMAGE" ]; then
            echo "Found AppImage: $APPIMAGE"
            mv "$APPIMAGE" VoiceBridgeServer.AppImage
          else
            echo "No AppImage found!"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBridgeServer-Linux
          path: VoiceBridgeServer.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/VoiceBridgeServer-Windows/VoiceBridgeServer.exe
            artifacts/VoiceBridgeServer-Linux/VoiceBridgeServer.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}